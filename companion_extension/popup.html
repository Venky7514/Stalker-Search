<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stalker Search Companion</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      width: 300px;
      background: #000000;
      color: #fafafa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f1f1f;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
    }
    .tag {
      font-size: 11px;
      color: #a3a3a3;
      border: 1px solid #262626;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .status-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #080808;
      border: 1px solid #1f1f1f;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #525252;
      flex-shrink: 0;
    }
    .dot.online {
      background: #22c55e;
    }
    .desc {
      color: #a3a3a3;
      font-size: 12px;
      margin: 0 0 14px 0;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #e5e5e5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Stalker Search</span>
    <span class="tag">Open Source</span>
  </div>
  <div class="status-box">
    <span id="status-dot" class="dot"></span>
    <span id="status-text">Checking local bridge (127.0.0.1)...</span>
  </div>
  <p class="desc">
    Privacy-focused local companion. Syncs public Google Search result links across pages to your local app. Zero cookies or personal data are ever transmitted.
  </p>
  <a class="btn" href="http://127.0.0.1:7878" target="_blank" rel="noopener noreferrer">
    Open Local Dashboard
  </a>
  <script src="popup.js"></script>
</body>
</html>
