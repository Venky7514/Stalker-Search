[package]
name = "stalker-search"
version = "0.1.0"
edition = "2021"
description = "Open-source, local-first digital footprint & personal OSINT privacy scanner"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
console = "0.15"
dirs = "5.0"
futures = "0.3"
indicatif = "0.17"
once_cell = "1.19"
regex = "1.10"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
toml = "0.8"
url = "2.5"
